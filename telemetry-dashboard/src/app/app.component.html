<div class="shell">
  <aside class="sidenav">
    <div class="brand">
      
  <span class="brand-mark">
    <img src="assets/images/actia-logo.png" alt="ACTIA" class="brand-logo" />
  </span>
  <div>
    <p class="brand-title">Vehicle Telemetry</p>
    <p class="brand-sub">diagnostics console</p>
  </div>
</div>
  

    <nav class="nav">
      <a routerLink="/live" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
        </svg>
        Live dashboard
      </a>
      <a routerLink="/devices" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/>
        </svg>
        Devices
      </a>
      <a routerLink="/analytics" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>
        </svg>
        Analytics / ML
      </a>
      <a routerLink="/alerts" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3l9 16H3z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="16" x2="12" y2="16.01"/>
        </svg>
        Alerts
      </a>
    </nav>

    <div class="sidenav-footer">
      <a routerLink="/simulator" routerLinkActive="active" class="nav-item nav-item--muted">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 3h6"/><path d="M10 3v6.5L4.5 19a1.5 1.5 0 001.3 2.2h12.4a1.5 1.5 0 001.3-2.2L14 9.5V3"/>
        </svg>
        Test publisher
      </a>
      <a routerLink="/model-test" routerLinkActive="active" class="nav-item nav-item--muted">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 5V3M12 21v-2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>
        </svg>
        ML model test
      </a>
      <p class="footer-note">Demo only — simulates a device over MQTT</p>

      <div class="conn-status" [class.conn-status--down]="!(ws.connected$ | async)">
        <span class="conn-dot"></span>
        {{ (ws.connected$ | async) ? 'Broker connected' : 'Reconnecting…' }}
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
