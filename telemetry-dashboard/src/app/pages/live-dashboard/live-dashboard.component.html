<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ACTIA · Live dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750;800&family=JetBrains+Mono:wght@500;600;750&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   ACTIA DESIGN SYSTEM -- verbatim from the provided styles.scss
   ========================================================================= */
:root {
  --ink: #3A3B3E;
  --sidebar-grey: #58595B;
  --sidebar-grey-dark: #414244;
  --canvas: #F5F6F6;
  --surface: #FFFFFF;
  --line: #E6E7E8;
  --line-dark: #D7D8D9;
  --text: #3A3B3E;
  --text-secondary: #66676A;
  --text-muted: #8C8D8F;
  --accent-green: #00954C;
  --accent-green-dark: #00753C;
  --accent-green-soft: #E4F5EB;
  --accent-green-100: #C8ECD8;
  --accent-red: #D7373F;
  --accent-red-soft: #FBEAEA;
  --accent-amber: #E8890C;
  --accent-amber-soft: #FDF1E2;
  --accent-blue: #3A7CA5;
  --accent-blue-soft: #EAF2F7;
  --bg: var(--canvas);
  --panel: var(--surface);
  --radius-lg: 20px;
  --radius: 15px;
  --radius-sm: 10px;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow-card: 0 2px 8px rgba(58,59,62,0.05), 0 8px 24px rgba(58,59,62,0.05);
  --shadow-hover: 0 4px 14px rgba(58,59,62,0.07), 0 12px 32px rgba(58,59,62,0.07);
  --bg-green: var(--accent-green-soft);
  --bg-amber: var(--accent-amber-soft);
  --bg-red: var(--accent-red-soft);
  --bg-blue: var(--accent-blue-soft);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--canvas); color: var(--ink); font-family: var(--font-ui); font-size: 14px; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
h1, h2, h3, h4 { margin: 0; color: var(--ink); font-weight: 700; letter-spacing: -0.015em; }
button, input, textarea, select { font-family: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.text-muted { color: var(--text-muted); }
::selection { background: var(--accent-green); color: #FFFFFF; }
:focus-visible { outline: 2px solid var(--accent-green); outline-offset: 2px; border-radius: 7px; }

.page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.4rem; }
.page-head h1 { font-size: 1.5rem; font-weight: 750; letter-spacing: -0.025em; }

.section-label { margin: 1.6rem 0 0.65rem; color: var(--text-muted); font-size: 0.62rem; font-weight: 750; text-transform: uppercase; letter-spacing: 0.08em; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0.9rem; }

.kpi-card { min-width: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid rgba(230,231,232,0.7); border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow-card); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.kpi-label { margin: 0 0 0.35rem; color: var(--text-muted); font-size: 0.67rem; font-weight: 500; }
.kpi-value { margin: 0; color: var(--ink); font-family: var(--font-mono); font-size: 1.5rem; font-weight: 750; font-variant-numeric: tabular-nums; }

.kpi-card--warn { background: var(--accent-amber-soft); border-color: rgba(232,137,12,0.25); }
.kpi-card--warn .kpi-value { color: var(--accent-amber); }
.kpi-card--bad { background: var(--accent-red-soft); border-color: rgba(215,55,63,0.25); }
.kpi-card--bad .kpi-value { color: var(--accent-red); }

.table-card { width: 100%; background: var(--surface); border: 1px solid rgba(230,231,232,0.7); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-card); }

.table-row { display: grid; grid-template-columns: 1.2fr 0.9fr 0.9fr 1fr 1fr; align-items: center; min-height: 48px; padding: 0.7rem 1rem; font-size: 0.72rem; text-decoration: none; color: var(--ink); }
.table-row--head { min-height: 42px; background: #F7F8F8; color: var(--text-muted); font-size: 0.58rem; font-weight: 750; text-transform: uppercase; letter-spacing: 0.07em; border-bottom: 1px solid var(--line); }
.table-row--body { border-top: 1px solid var(--line); transition: background .15s ease, box-shadow .15s ease; }
.table-row--body:first-of-type { border-top: none; }
a.table-row--body:hover { background: #FAFBFB; }

.status-success { background: var(--accent-green-soft); color: var(--accent-green-dark); }
.status-warning { background: var(--accent-amber-soft); color: var(--accent-amber); }
.status-critical { background: var(--accent-red-soft); color: var(--accent-red); }

.empty-state { padding: 2.5rem 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--text-muted); font-size: 0.72rem; line-height: 1.6; background: var(--surface); }
.empty-state a { margin-top: 0.2rem; color: var(--accent-green-dark); font-weight: 600; text-decoration: none; }
.empty-state a:hover { text-decoration: underline; }

.card { background: var(--surface); border: 1px solid rgba(230,231,232,0.7); border-radius: var(--radius-lg); padding: 1.2rem; box-shadow: var(--shadow-card); }
.card:hover { box-shadow: var(--shadow-hover); }

@media (max-width: 900px) {
  .table-card { overflow-x: auto; }
  .table-row { min-width: 720px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 600px) {
  .page-head { margin-bottom: 1rem; }
  .page-head h1 { font-size: 1.25rem; }
  .kpi-grid { grid-template-columns: 1fr; }
}

/* =========================================================================
   ADDITIVE ONLY -- not present in styles.scss, needed to lay out this demo
   page (shell + sidebar + status pill inline badge). Uses the same tokens
   above so it stays consistent with the ACTIA system. Nothing here
   overrides an existing class.
   ========================================================================= */
.app-shell { display: flex; min-height: 100vh; }

.app-sidebar {
  width: 232px;
  flex-shrink: 0;
  background: var(--sidebar-grey);
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
}
.app-sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 22px; }
.app-sidebar .brand-mark { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--accent-green); display: grid; place-items: center; flex-shrink: 0; }
.app-sidebar .brand-name { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.2; }
.app-sidebar .brand-sub { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 1px; }
.app-sidebar .nav { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.app-sidebar .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,0.75); cursor: pointer; transition: background .15s ease, color .15s ease; }
.app-sidebar .nav-item:hover { background: var(--sidebar-grey-dark); color: #fff; }
.app-sidebar .nav-item.active { background: var(--accent-green); color: #fff; font-weight: 600; }
.app-sidebar .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.app-sidebar .sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 11.5px; color: rgba(255,255,255,0.5); }

.app-main { flex: 1; min-width: 0; padding: 26px 34px 60px; }

.eyebrow { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 750; letter-spacing: .07em; color: var(--accent-green-dark); text-transform: uppercase; margin-bottom: 6px; }
.eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); }
.page-head .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

.head-actions { display: flex; align-items: center; gap: 10px; }
.live-pill { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--accent-green-dark); background: var(--accent-green-soft); padding: 6px 12px; border-radius: 20px; }
.live-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.icon-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--text); }

/* status pill shell -- wraps .status-success/.status-warning/.status-critical */
.status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 20px; width: fit-content; }
.status-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
.status-success .dot { background: var(--accent-green); }
.status-warning .dot { background: var(--accent-amber); }
.status-critical .dot { background: var(--accent-red); }

.section-block-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.section-block-head h2 { font-size: 16px; font-weight: 750; margin: 2px 0 3px; }
.section-block-head p { font-size: 12.5px; color: var(--text-muted); margin: 0; }
</style>
</head>
<body>
<div class="app-shell">



  <!-- ===== Main ===== -->
  <main class="app-main">

    <div class="page-head">
      <div>
        <div class="eyebrow"><span class="dot"></span> VEHICLE TELEMETRY PLATFORM</div>
        <h1>Live dashboard</h1>
        <div class="subtitle">Suivi temps réel du parc — MQTT · Kafka · PostgreSQL</div>
      </div>
      <div class="head-actions">
        <div class="live-pill"><span class="dot"></span> Live</div>
        <div class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        </div>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <p class="kpi-label">Vehicles reporting</p>
        <p class="kpi-value num" id="kpi-online">42</p>
      </div>
      <div class="kpi-card">
        <p class="kpi-label">Messages / min</p>
        <p class="kpi-value num" id="kpi-msgs">318</p>
      </div>
      <div class="kpi-card kpi-card--warn" id="kpi-anomaly-card">
        <p class="kpi-label">Active anomalies</p>
        <p class="kpi-value num" id="kpi-anomalies">2</p>
      </div>
    </div>

    <p class="section-label">VEHICLES</p>
    <div class="section-block-head">
      <div>
        <h2>Live feed</h2>
        <p>Dernières lectures reçues par la plateforme</p>
      </div>
    </div>

    <div class="table-card" style="margin-top: 12px;">
      <div class="table-row table-row--head">
        <span>Vehicle</span>
        <span>Status</span>
        <span>Risk</span>
        <span>Probability</span>
        <span>Last update</span>
      </div>
      <div id="table-body"></div>
    </div>

  </main>
</div>

<script>
  const vehicleIds = ['VIN-042','VIN-118','VIN-207','VIN-355','VIN-089','VIN-271','VIN-014','VIN-330'];
  // maps directly to the real classes: status-success / status-warning / status-critical
  const statusClasses = ['status-success','status-success','status-success','status-warning'];
  const riskClasses = ['status-success','status-warning','status-critical'];
  const statusLabels = { 'status-success':'online', 'status-warning':'offline' };
  const riskLabels = { 'status-success':'low', 'status-warning':'medium', 'status-critical':'high' };

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function timeNow(){ return new Date().toTimeString().slice(0,8); }

  function makeDevice(){
    const riskClass = pick(riskClasses);
    const prob = riskClass === 'status-critical' ? rand(0.7,0.98) : riskClass === 'status-warning' ? rand(0.35,0.7) : rand(0.01,0.35);
    return {
      id: pick(vehicleIds),
      statusClass: pick(statusClasses),
      riskClass,
      prob,
      time: timeNow()
    };
  }

  let devices = Array.from({length: 6}, makeDevice);

  function render(){
    const body = document.getElementById('table-body');
    if(devices.length === 0){
      body.innerHTML = `<div class="empty-state">No telemetry yet. Publish some readings from the <a href="#">Test publisher</a> to see live data here.</div>`;
      return;
    }
    body.innerHTML = devices.map(d => `
      <a class="table-row table-row--body" href="#">
        <span class="num">${d.id}</span>
        <span class="status-pill ${d.statusClass}"><span class="dot"></span>${statusLabels[d.statusClass]}</span>
        <span class="status-pill ${d.riskClass}"><span class="dot"></span>${riskLabels[d.riskClass]}</span>
        <span class="num">${(d.prob*100).toFixed(1)}%</span>
        <span class="text-muted">${d.time}</span>
      </a>
    `).join('');
  }

  function tick(){
    devices.unshift(makeDevice());
    devices = devices.slice(0, 8);
    render();

    document.getElementById('kpi-online').textContent = Math.floor(rand(38,45));
    document.getElementById('kpi-msgs').textContent = Math.floor(rand(280,360));
    const anomalies = devices.filter(d => d.riskClass === 'status-critical').length;
    document.getElementById('kpi-anomalies').textContent = anomalies;
    const card = document.getElementById('kpi-anomaly-card');
    card.classList.toggle('kpi-card--warn', anomalies > 0);
  }

  render();
  setInterval(tick, 2600);
</script>
</body>
</html>
