server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques Angular (JS/CSS/images) avec cache long
    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Proxy REST vers le backend Spring Boot (nom du conteneur sur telemetry-network)
    location /api/ {
        proxy_pass http://telemetry-backend:8084/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (STOMP) vers le backend
    location /ws/ {
        proxy_pass http://telemetry-backend:8084/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Routing Angular (SPA) : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
